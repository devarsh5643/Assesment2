name: Deploy bakery website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bakery-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Amazon Linux server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate PHP files
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Add the EC2_SSH_PRIVATE_KEY repository secret before deploying."
            exit 1
          fi
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::Add the ADMIN_PASSWORD repository secret before deploying."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          php -r 'echo password_hash(getenv("ADMIN_PASSWORD"), PASSWORD_DEFAULT);' > ~/.ssh/admin_password_hash
          chmod 600 ~/.ssh/admin_password_hash
          ssh-keyscan -H 32.236.141.114 >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='data/bakery.db' \
            --exclude='data/bakery.db-*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ec2-user@32.236.141.114:/tmp/adelaide-bakery-release/
          scp -i ~/.ssh/deploy_key \
            ~/.ssh/admin_password_hash \
            ec2-user@32.236.141.114:/tmp/admin_password_hash

      - name: Activate release
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@32.236.141.114 <<'REMOTE'
            set -euo pipefail

            sudo mkdir -p /var/www/html/data
            sudo rsync -a --delete \
              --exclude='data/bakery.db' \
              --exclude='data/bakery.db-*' \
              /tmp/adelaide-bakery-release/ /var/www/html/

            sudo chown -R apache:apache /var/www/html/data
            sudo find /var/www/html -type d -exec chmod 755 {} +
            sudo find /var/www/html -type f -exec chmod 644 {} +
            sudo restorecon -RF /var/www/html 2>/dev/null || true

            if ! sudo test -f /var/www/.bakery-admin-password-hash; then
              sudo install -o apache -g apache -m 600 \
                /tmp/admin_password_hash /var/www/.bakery-admin-password-hash
            fi
            sudo restorecon -F /var/www/.bakery-admin-password-hash 2>/dev/null || true

            if ! sudo test -f /var/www/.bakery-admin-mfa.json; then
              printf '%s\n' '{"enabled":false,"secret":"","recovery_codes":[],"last_counter":-1}' \
                > /tmp/admin_mfa.json
              sudo install -o apache -g apache -m 600 \
                /tmp/admin_mfa.json /var/www/.bakery-admin-mfa.json
            fi
            sudo restorecon -F /var/www/.bakery-admin-mfa.json 2>/dev/null || true

            sudo apachectl configtest
            sudo systemctl reload httpd
            rm -rf /tmp/adelaide-bakery-release
            rm -f /tmp/admin_password_hash /tmp/admin_mfa.json
          REMOTE

      - name: Configure trusted HTTPS certificate
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@32.236.141.114 <<'REMOTE'
            set -euo pipefail

            SITE_IP="32.236.141.114"
            CERTBOT="/opt/certbot/bin/certbot"

            sudo dnf install -y mod_ssl python3.11 python3.11-pip

            if [ ! -x "$CERTBOT" ]; then
              sudo python3.11 -m venv /opt/certbot
            fi
            sudo /opt/certbot/bin/pip install --quiet --upgrade pip certbot

            sudo mkdir -p /var/www/html/.well-known/acme-challenge
            sudo chown -R apache:apache /var/www/html/.well-known

            if [ ! -f "/etc/letsencrypt/live/$SITE_IP/fullchain.pem" ]; then
              sudo "$CERTBOT" certonly \
                --webroot \
                --webroot-path /var/www/html \
                --ip-address "$SITE_IP" \
                --cert-name "$SITE_IP" \
                --preferred-profile shortlived \
                --non-interactive \
                --agree-tos \
                --register-unsafely-without-email
            else
              sudo "$CERTBOT" renew --cert-name "$SITE_IP" --quiet
            fi

            if [ -f /etc/httpd/conf.d/ssl.conf ]; then
              sudo mv /etc/httpd/conf.d/ssl.conf /etc/httpd/conf.d/ssl.conf.disabled
            fi

            sudo tee /etc/httpd/conf.d/adelaide-bakery-https.conf >/dev/null <<APACHE
          Listen 443 https

          <VirtualHost *:80>
              ServerName $SITE_IP
              DocumentRoot /var/www/html

              Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
              <Directory /var/www/html/.well-known/acme-challenge>
                  Require all granted
              </Directory>

              RewriteEngine On
              RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
              RewriteRule ^ https://$SITE_IP%{REQUEST_URI} [R=301,L,NE]
          </VirtualHost>

          <VirtualHost *:443>
              ServerName $SITE_IP
              DocumentRoot /var/www/html

              SSLEngine on
              SSLCertificateFile /etc/letsencrypt/live/$SITE_IP/fullchain.pem
              SSLCertificateKeyFile /etc/letsencrypt/live/$SITE_IP/privkey.pem
              SSLProtocol -all +TLSv1.2 +TLSv1.3

              <Directory /var/www/html>
                  Options -Indexes +FollowSymLinks
                  AllowOverride All
                  Require all granted
              </Directory>

              ErrorLog /var/log/httpd/adelaide-bakery-ssl-error.log
              CustomLog /var/log/httpd/adelaide-bakery-ssl-access.log combined
          </VirtualHost>
          APACHE

            sudo tee /etc/systemd/system/certbot-renew.service >/dev/null <<SERVICE
          [Unit]
          Description=Renew the Adelaide Bakery HTTPS certificate

          [Service]
          Type=oneshot
          ExecStart=$CERTBOT renew --quiet --deploy-hook "/usr/bin/systemctl reload httpd"
          SERVICE

            sudo tee /etc/systemd/system/certbot-renew.timer >/dev/null <<'TIMER'
          [Unit]
          Description=Check the Adelaide Bakery HTTPS certificate twice daily

          [Timer]
          OnCalendar=*-*-* 00,12:00:00
          RandomizedDelaySec=1h
          Persistent=true

          [Install]
          WantedBy=timers.target
          TIMER

            sudo systemctl daemon-reload
            sudo systemctl enable --now certbot-renew.timer
            sudo apachectl configtest
            sudo systemctl restart httpd
          REMOTE

      - name: Verify live website
        run: |
          curl --fail --show-error --retry 5 --retry-delay 3 https://32.236.141.114/
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://32.236.141.114/)" = "301"
